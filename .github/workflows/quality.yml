name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
        working-directory: cli
      - run: bun run check:ci && bun test && bun run build && bun run dev --help
        working-directory: cli
      - run: bash -n ouroboros.sh scripts/eval.sh scripts/eval-ouroboros.sh
      - run: git diff --exit-code
